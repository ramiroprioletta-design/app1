 <!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración PWA para Celulares -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#rosa">
<meta name="mobile-web-app-capable" content="yes">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Recomendaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>🎬 App de Recomendaciones</h1>

        <form>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ingrese el título" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione</option>
                <option>Película</option>
                <option>Serie</option>
                <option>Anime</option>
                <option>Juego</option>
            </select>

            <label for="genero">Género</label>
            <select id="genero" name="genero" required>
                <option value="">Seleccione</option>
                <option>Acción</option>
                <option>Aventura</option>
                <option>Comedia</option>
                <option>Drama</option>
                <option>Terror</option>
                <option>Ciencia Ficción</option>
            </select>

            <label for="fecha">Fecha de lanzamiento</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="puntuacion">Puntuación (1-10)</label>
            <input type="number" id="puntuacion" name="puntuacion"
                   min="1" max="10" required>

            <label for="portada">URL de la portada</label>
            <input type="url" id="portada" name="portada"
                   placeholder="https://imagen.com">

            <label for="resena">Reseña</label>
            <textarea id="resena" name="resena"
                      placeholder="Escriba una reseña..." required></textarea>

            <label for="motivo">¿Por qué la recomiendas?</label>
            <textarea id="motivo" name="motivo"
                      placeholder="Explica el motivo..." required></textarea>

            <div class="checkbox">
                <input type="checkbox" id="recomendar" name="recomendar">
                <label for="recomendar">La recomiendo</label>
            </div>

            <button type="submit">Publicar Recomendación</button>

        </form>
    </div>

</body>
</html>
